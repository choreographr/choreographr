# Workspace-level cargo-nextest configuration.
#
# Discovered at <workspace-root>/.config/nextest.toml (nextest >= 0.9).
# Rationale for each setting is inline — see also README.md "Testing & development".

[profile.default]
# Run the entire suite even after a failure. The pre-commit workflow wants the
# full picture (all failures + slowest tests) before committing; failing fast
# would hide the rest of a run's regressions. (libtest default: fail fast.)
fail-fast = false

# Bound any single test at 120s: nextest terminates a test once it has been
# running for `period` (60s) × `terminate-after` (2) = 120s and reports it as a
# failure. (The intermediate "slow" marking is just reporter signal — the kill
# happens at the full budget.) This is the CI-level guard against hung tests —
# it replaces ad-hoc watchdog threads in integration tests (e.g. the 120s abort
# thread in choreographr/tests/mcp_integration.rs) while leaving the
# libtest-only `cargo test -- --ignored` path with its own in-test watchdog.
# Healthy tests finish in well under a minute; anything slower is a regression.
slow-timeout = { period = "60s", terminate-after = 2 }
