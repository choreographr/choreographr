[workspace]
members = [
    "choreo-acp",
    "choreo-client-core",
    "choreo-daemon",
    "choreo-keystore",
    "choreo-markdown",
    "choreo-mcp",
    "choreo-proto",
    "choreo-tui",
    "choreo-gui",
    "choreo-im",
    "choreo-transport",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
choreo-client-core = { path = "choreo-client-core" }
choreo-keystore = { path = "choreo-keystore" }
choreo-proto = { path = "choreo-proto" }
choreo-im = { path = "choreo-im" }
choreo-markdown = { path = "choreo-markdown" }
choreo-mcp = { path = "choreo-mcp" }
choreo-transport = { path = "choreo-transport" }
ureq = { version = "3", features = ["json"] }
ammonia = "4"
base64 = "0.23"
dirs = "6"
redb = "4"
image = "0.25"
rand = "0.10"
resvg = "0.47"
serde_json = "1"
schemars = { version = "1.2.1", features = ["derive"] }
yaml_serde = "0.10"
signal-hook = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
lru = "0.18"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.10"
sha2 = "0.11"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
snow = "0.10"
url = "2"
humfmt = "0.6.0"
nix = "0.31.3"
