[package]
name = "choreographr"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# `cargo run -p choreographr` (and `cargo install choreographr`) default to the
# daemon binary; the other suite binaries remain explicit targets.
default-run = "choreographr"

[dependencies]
choreo-daemon = { path = "choreo-daemon", version = "0.1" }
choreo-tui = { path = "choreo-tui", version = "0.1" }
choreo-im = { path = "choreo-im", version = "0.1" }
choreo-acp = { path = "choreo-acp", version = "0.1" }
anyhow.workspace = true
mimalloc = { version = "0.1", optional = true }

[features]
# Native PDF tools (pdf_classify / pdf_to_markdown) for the shipped binaries.
# Off by default so `cargo install choreographr` from crates.io never pulls the
# git-pinned pdf-inspector fork (crates.io rejects git deps, and the unpatched
# registry version re-opens RUSTSEC-2026-0187 — see [patch.crates-io] below).
# scripts/release.sh builds the release binaries with `--features pdf,metrics`, which
# resolves the fork via the workspace patch.
pdf = ["choreo-daemon/pdf"]
# Prometheus/OpenMetrics instrumentation + `/metrics` HTTP server. Off by
# default (mirrors `choreo-daemon`); build with `--features metrics` (or
# `--features pdf,metrics` for release binaries) to opt in. Release binaries
# ship it via scripts/release.sh, keeping the advertised `/metrics` endpoint.
metrics = ["choreo-daemon/metrics"]
# mimalloc — process-wide allocator, enabled ONLY by the static musl tarball
# build in scripts/release.sh (musl's default malloc is weaker; mimalloc's
# per-thread heaps replace it). Off by default so crates.io / `cargo install`
# builds stay on the system allocator and need no C compiler.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "choreographr"
path = "src/bin/choreographr.rs"

[[bin]]
name = "choreo-tui"
path = "src/bin/choreo-tui.rs"

[[bin]]
name = "choreo-im"
path = "src/bin/choreo-im.rs"

[[bin]]
name = "choreo-acp"
path = "src/bin/choreo-acp.rs"

# cargo-binstall metadata: lets `cargo binstall choreographr` resolve our
# GitHub release asset naming (`choreographr-<version>-<target>.<ext>`) from
# the package itself, instead of needing a manual `--pkg-url`. The `{ ... }`
# tokens are binstall template variables; spaces inside them are ignored.
[package.metadata.binstall]
pkg-url = "https://github.com/ethernomad/choreographr/releases/download/{ version }/choreographr-{ version }-{ target }.{ archive-suffix }"
bin-dir = ""

[workspace]
members = [
    "choreo-acp",
    "choreo-ai-protocols",
    "choreo-client-core",
    "choreo-daemon",
    "choreo-keystore",
    "choreo-markdown",
    "choreo-mcp",
    "choreo-proto",
    "choreo-tui",
    "choreo-gui",
    "choreo-im",
    "choreo-transport",
]
resolver = "3"

# Shared package metadata inherited by every member via `*.workspace = true`.
# MSRV: the workspace builds and tests on Rust 1.91 and newer; keep code and
# dependencies within this floor (see ARCHITECTURE.md).
#
# version/license/repository/homepage/readme/description are required by
# crates.io for published crates; the publish-set members inherit them, while
# private members opt out with `publish = false`. `readme` is resolved
# relative to the workspace root (the file that lives at ./README.md).
[workspace.package]
rust-version = "1.91"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/ethernomad/choreographr"
homepage = "https://choreographr.com"
readme = "README.md"
description = "Agentic coding assistant — daemon, TUI, and bridges"

# cargo-release config (see the Phase 4 publish-set note in ARCHITECTURE.md).
# `dependent-version = "fix"` keeps published manifest version requirements
# (`choreo-tui = "0.1"` etc.) in lockstep across minor/major bumps: when a
# dependency's version moves, dependents' requirements are bumped along with
# it so a `cargo release` of the workspace always leaves mutually-compatible
# manifests on crates.io.
[workspace.metadata.release]
dependent-version = "fix"

# Release profile for shipped binaries (all four artifact types build with
# `cargo build --release`). Two deliberate settings, one deliberate omission:
#
# - strip = "symbols": cuts shipped size ~22% (tarball ~10%). Panic messages
#   keep their file:line locations (compiled-in string constants via
#   #[track_caller]); only RUST_BACKTRACE=1 symbolization is lost, and nothing
#   in the daemon emits backtraces. Keep .deb/.rpm/tarball uniform: the RPM
#   path disables brp post-install processing (__os_install_post %{nil}) so
#   rpm never re-processes these already-stripped binaries.
# - lto = "thin": cross-crate optimization at a fraction of fat-LTO's build
#   time. Works with the wild linker (used on this machine via
#   -fuse-ld=wild, see ~/.cargo/config.toml) through its linker-plugin LTO
#   support, which wild lists as functional-with-known-issues — if a future
#   wild regression breaks linking, drop back to lto = false.
# - NO panic = "abort": the daemon isolates request-worker panics with
#   catch_unwind (sessions.rs) — abort would turn any single request panic
#   into a whole-daemon crash.
[profile.release]
lto = "thin"
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
choreo-ai-protocols = { path = "choreo-ai-protocols", version = "0.1" }
choreo-client-core = { path = "choreo-client-core", version = "0.1" }
choreo-keystore = { path = "choreo-keystore", version = "0.1" }
choreo-proto = { path = "choreo-proto", version = "0.1" }
choreo-im = { path = "choreo-im", version = "0.1" }
choreo-markdown = { path = "choreo-markdown", version = "0.1" }
choreo-mcp = { path = "choreo-mcp", version = "0.1" }
choreo-transport = { path = "choreo-transport", version = "0.1" }
ureq = { version = "3", features = ["json"] }
ammonia = "4"
base64 = "0.23"
dirs = "6"
redb = "4"
image = "0.25"
rand = "0.10"
resvg = "0.48"
serde_json = "1"
schemars = { version = "1.2.1", features = ["derive"] }
yaml_serde = "0.10"
signal-hook = "0.4"
# Held at 3.x (3.5.0): serial_test 4.0.1 requires Rust 1.93.1, above the workspace MSRV floor (1.91).
serial_test = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "1.1"
lru = "0.18"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.10"
sha2 = "0.11"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# MessagePack (named mode) for anything that crosses a language boundary:
# the client↔daemon wire and DB values. Named encoding (struct fields as map
# keys, enum variants by name) gives JSON-grade evolution safety in a compact
# binary format with universal language support. Pin 1.3: name-based enum
# encoding is new in this line. postcard stays for the Rust-only VM and
# credential channels (see ARCHITECTURE.md).
rmp-serde = "1.3"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
# Multi-producer/single-consumer channels with `select!` — the event-driven
# replacement for `recv_timeout` polling when a thread must wait on several
# channels at once (cancellation alongside tool results / SSE events).
crossbeam-channel = "0.5"
snow = "0.10"
url = "2"
humfmt = "0.6.0"
nix = "0.31.3"
unicode-segmentation = "1.13"

# Patch crates.io `pdf-inspector` to the security fork — LOCAL builds only.
#
# `choreo-daemon` declares `pdf-inspector = "0.1"` (a registry dep, behind its
# optional `pdf` feature) so its published manifest passes crates.io's
# no-git-dependencies rule. This workspace-root patch then redirects that
# registry version to `omeileo/pdf-inspector@f86decf` whenever we build from
# the git tree (dev builds, tests with `--all-features`, and the release
# binaries via `scripts/release.sh --features pdf,metrics`). Patches are never
# included in published manifests, so crates.io consumers resolve the plain
# registry version — which is exactly why the `pdf` feature is off by default
# (see the comments in the root [features] and `choreo-daemon/Cargo.toml`).
#
# Why the fork: upstream (firecrawl/pdf-inspector) still ships lopdf ^0.41.0,
# vulnerable to RUSTSEC-2026-0187 (stack-overflow SIGABRT on a crafted ~21 KB
# PDF with ~10,000-deep nested objects); the fork bumps lopdf to 0.42.0
# (MAX_NESTING_DEPTH), verified source-compatible by upstream PR
# firecrawl/pdf-inspector#198 (omeileo commit f86decf). Re-checked 2026-08-09:
# crates.io pdf-inspector 0.1.7 still depends on lopdf ^0.41.0, so the pin
# stays. Once upstream publishes with lopdf >= 0.42, delete this section, drop
# the `pdf` feature gates, and make the dependency unconditional.
[patch.crates-io]
pdf-inspector = { git = "https://github.com/omeileo/pdf-inspector", rev = "f86decf82d72e4bc318aaf54c04f854763cbed1c" }
