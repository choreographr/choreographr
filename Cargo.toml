[workspace]
members = [
    "tai-client-core",
    "tai-daemon",
    "tai-keystore",
    "tai-markdown",
    "tai-proto",
    "tai-tui",
    "tai-dioxus",
    "tai-im",
    "tai-transport",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tai-client-core = { path = "tai-client-core" }
tai-keystore = { path = "tai-keystore" }
tai-proto = { path = "tai-proto" }
tai-im = { path = "tai-im" }
tai-markdown = { path = "tai-markdown" }
tai-transport = { path = "tai-transport" }
ureq = { version = "3", features = ["json"] }
ammonia = "4"
base64 = "0.22"
dirs = "6"
redb = "4"
image = "0.25"
rand = "0.10"
resvg = "0.47"
serde_json = "1"
yaml_serde = "0.10"
signal-hook = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
lru = "0.18"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.10"
sha2 = "0.11"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
tempfile = "3"
clap = { version = "4.6.1", features = ["derive"] }
snow = "0.10"
url = "2"
