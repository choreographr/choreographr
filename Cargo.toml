[workspace]
members = [
    "tai-client-core",
    "tai-daemon",
    "tai-keystore",
    "tai-markdown",
    "tai-proto",
    "tai-tui",
    "tai-dioxus",
    "tai-im",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tai-client-core = { path = "tai-client-core" }
tai-keystore = { path = "tai-keystore" }
tai-proto = { path = "tai-proto" }
tai-im = { path = "tai-im" }
tai-markdown = { path = "tai-markdown" }
ammonia = "4"
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
dirs = "6"
redb = "4"
image = "0.25"
rand = "0.10"
resvg = "0.47"
serde_json = "1"
yaml_serde = "0.10"
signal-hook = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
lru = "0.18"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
