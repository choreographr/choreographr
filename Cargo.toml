[workspace]
members = [
    "choreo-acp",
    "choreo-ai-protocols",
    "choreo-client-core",
    "choreo-daemon",
    "choreo-keystore",
    "choreo-markdown",
    "choreo-mcp",
    "choreo-proto",
    "choreo-tui",
    "choreo-gui",
    "choreo-im",
    "choreo-transport",
]
resolver = "3"

# Shared package metadata inherited by every member via `*.workspace = true`.
# MSRV: the workspace builds and tests on Rust 1.91 and newer; keep code and
# dependencies within this floor (see ARCHITECTURE.md).
[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
choreo-ai-protocols = { path = "choreo-ai-protocols" }
choreo-client-core = { path = "choreo-client-core" }
choreo-keystore = { path = "choreo-keystore" }
choreo-proto = { path = "choreo-proto" }
choreo-im = { path = "choreo-im" }
choreo-markdown = { path = "choreo-markdown" }
choreo-mcp = { path = "choreo-mcp" }
choreo-transport = { path = "choreo-transport" }
ureq = { version = "3", features = ["json"] }
ammonia = "4"
base64 = "0.23"
dirs = "6"
redb = "4"
image = "0.25"
rand = "0.10"
resvg = "0.48"
serde_json = "1"
schemars = { version = "1.2.1", features = ["derive"] }
yaml_serde = "0.10"
signal-hook = "0.4"
# Held at 3.x (3.5.0): serial_test 4.0.1 requires Rust 1.93.1, above the workspace MSRV floor (1.91).
serial_test = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "1.1"
lru = "0.18"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.10"
sha2 = "0.11"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# MessagePack (named mode) for anything that crosses a language boundary:
# the client↔daemon wire and DB values. Named encoding (struct fields as map
# keys, enum variants by name) gives JSON-grade evolution safety in a compact
# binary format with universal language support. Pin 1.3: name-based enum
# encoding is new in this line. postcard stays for the Rust-only VM and
# credential channels (see ARCHITECTURE.md).
rmp-serde = "1.3"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
# Multi-producer/single-consumer channels with `select!` — the event-driven
# replacement for `recv_timeout` polling when a thread must wait on several
# channels at once (cancellation alongside tool results / SSE events).
crossbeam-channel = "0.5"
snow = "0.10"
url = "2"
humfmt = "0.6.0"
nix = "0.31.3"
unicode-segmentation = "1.13"
