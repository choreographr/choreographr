[package]
name = "choreographr"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# `cargo run -p choreographr` (and `cargo install choreographr`) default to the
# daemon binary; the other suite binaries remain explicit targets.
default-run = "choreographr"

[dependencies]
choreo-daemon = { path = "choreo-daemon", version = "0.1" }
choreo-tui = { path = "choreo-tui", version = "0.1" }
choreo-im = { path = "choreo-im", version = "0.1" }
choreo-acp = { path = "choreo-acp", version = "0.1" }
anyhow.workspace = true
mimalloc = { version = "0.1", optional = true }

[features]
# Prometheus/OpenMetrics instrumentation + `/metrics` HTTP server. Off by
# default (mirrors `choreo-daemon`); build with `--features metrics` (or
# `--features metrics,blockchain` for release binaries) to opt in. Release
# binaries ship it via scripts/release.sh, keeping the advertised `/metrics`
# endpoint.
metrics = ["choreo-daemon/metrics"]
# Blockchain tools (EVM / Substrate-Polkadot) from choreo-daemon. Off by
# default; opt in with `--features blockchain`.
blockchain = ["choreo-daemon/blockchain"]
# Choreographr Coordination Platform tools from choreo-daemon. Off by default;
# opt in with `--features content`.
content = ["choreo-daemon/content"]
# Opt-in AVIF decode via `image/avif-native` (dav1d, a C library). Off by
# default so the default/release build stays C-free (see the release.sh
# static-musl rationale); a source build with `--features avif` enables it for
# both the daemon (read_image / display_image) and the TUI (display decode).
avif = ["choreo-daemon/avif", "choreo-tui/avif"]
# mimalloc — process-wide allocator, enabled ONLY by the static musl tarball
# build in scripts/release.sh (musl's default malloc is weaker; mimalloc's
# per-thread heaps replace it). Off by default so crates.io / `cargo install`
# builds stay on the system allocator and need no C compiler.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "choreographr"
path = "src/bin/choreographr.rs"

[[bin]]
name = "choreo-tui"
path = "src/bin/choreo-tui.rs"

[[bin]]
name = "choreo-im"
path = "src/bin/choreo-im.rs"

[[bin]]
name = "choreo-acp"
path = "src/bin/choreo-acp.rs"

# cargo-binstall metadata: lets `cargo binstall choreographr` resolve our
# GitHub release asset naming (`choreographr-<version>-<target>.<ext>`) from
# the package itself, instead of needing a manual `--pkg-url`. The `{ ... }`
# tokens are binstall template variables; spaces inside them are ignored.
[package.metadata.binstall]
pkg-url = "https://github.com/choreographr/choreographr/releases/download/v{ version }/choreographr-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Linux glibc hosts (x86_64-unknown-linux-gnu) get no release tarball: the
# Linux tarball is the static musl build. Map that target to the musl asset so
# plain `cargo binstall choreographr` works on glibc distros without --target.
#
# Template notes (binstall semantics): `{ version }` renders as the bare semver
# (0.1.0) — the `v` prefix on the tag is written explicitly in the path — and
# `{ archive-suffix }` already includes the leading dot (`.tar.gz`), so there
# is NO literal dot before it (`.{ archive-suffix }` would produce `..tar.gz`).
# `bin-dir` must not be empty: the tarball has the binaries at the archive root,
# which is spelled `{ bin }{ binary-ext }` — an empty `bin-dir` renders an empty
# source path and binstall rejects it.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/choreographr/choreographr/releases/download/v{ version }/choreographr-{ version }-x86_64-unknown-linux-musl{ archive-suffix }"

[workspace]
members = [
    "choreo-acp",
    "choreo-ai-protocols",
    "choreo-blockchain",
    "choreo-client-core",
    "choreo-content",
    "choreo-daemon",
    "choreo-keystore",
    "choreo-markdown",
    "choreo-mcp",
    "choreo-proto",
    "choreo-sanitize",
    "choreo-tui",
    "choreo-gui",
    "choreo-image",
    "choreo-im",
    "choreo-transport",
]
resolver = "3"

# Shared package metadata inherited by every member via `*.workspace = true`.
# MSRV: the workspace builds and tests on Rust 1.94.1 and newer; keep code
# and dependencies within this floor (see ARCHITECTURE.md).
#
# Bumped from 1.92 to 1.94.1 in the 2026-08 dependency refresh: serial_test
# 4.x requires Rust 1.93.1 (it was previously held at 3.x because 4.0.1 sat
# above the old floor), and alloy 2.4.1 now requires 1.94.1.
#
# version/license/repository/homepage/readme/description are required by
# crates.io for published crates; the publish-set members inherit them, while
# private members opt out with `publish = false`. `readme` is resolved
# relative to the workspace root (the file that lives at ./README.md).
[workspace.package]
rust-version = "1.94.1"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/choreographr/choreographr"
homepage = "https://choreographr.com"
readme = "README.md"
description = "Agentic coding assistant — daemon, TUI, and bridges"

# cargo-release config (see the Phase 4 publish-set note in ARCHITECTURE.md).
# `dependent-version = "fix"` keeps published manifest version requirements
# (`choreo-tui = "0.1"` etc.) in lockstep across minor/major bumps: when a
# dependency's version moves, dependents' requirements are bumped along with
# it so a `cargo release` of the workspace always leaves mutually-compatible
# manifests on crates.io.
[workspace.metadata.release]
dependent-version = "fix"

# Dev profile (the default for `cargo build` / `cargo run` / `cargo test`).
# debug = "line-tables-only": emit line tables (file:line for backtraces)
# without full debug info — cuts compile time and .rlib/.bin size vs the
# default full debuginfo while still giving usable backtraces when things
# go wrong during development.
#
# rustflags (requires the [unstable] profile-rustflags opt-in in
# .cargo/config.toml; nightly-only — see rust-toolchain.toml): auto-applied to
# every adhoc `cargo` command under the nightly default toolchain, including
# per-crate `cargo build -p choreo-x` / `cargo check -p x` / `cargo nextest
# run -p x`.
# - -Zshare-generics=yes: emit each generic monomorphization once per crate
#   graph instead of once per using crate — the big dev-build win. Deliberately
#   dev-ONLY: it has a history of codegen bugs under optimization, and with no
#   LTO in the release profile there is no link-time dedup to compare against.
# - -Zunstable-options + --jobs-frontend=0: parallelize the rustc query
#   frontend across one thread per logical core (0 = available_parallelism —
#   rustc's "auto"; replaces the deprecated -Zthreads). Self-tuning: a 2-core
#   laptop and a 64-core box each get the right pool size with no edit.
# - -C target-cpu=native: build for the LOCAL machine's CPU (AVX2/BMI2 on
#   x86-64, the M-chip on Apple Silicon) so every local build — dev, test, and
#   release — is tuned for the box it runs on. This is the repo-wide default
#   and deliberately NEVER reaches a shipped artifact: dist binaries are built
#   on STABLE via scripts/build-stable.sh, which strips these per-profile
#   rustflags keys (so they stay on the target's baseline CPU), and
#   scripts/publish-stable.sh strips them for crates.io (profile rustflags in
#   a published manifest hard-break stable `cargo install` — the
#   profile-rustflags feature is nightly-only). The RISC-V guest compiles in
#   choreo-daemon/src/tools/vm.rs are direct `rustc +stable` calls and never
#   see cargo rustflags at all.
#   KEEP THE ARRAY ON ONE LINE: build-stable.sh / publish-stable.sh strip
#   `^rustflags = [` lines exactly; a multi-line array would leave dangling
#   entries in the stripped manifest and break the stable build.
[profile.dev]
debug = "line-tables-only"
rustflags = ["-Zunstable-options", "--jobs-frontend=0", "-Zshare-generics=yes", "-C", "target-cpu=native"]

# Release profile for shipped binaries (all four artifact types build with
# `cargo build --release`). One deliberate setting, one deliberate omission:
#
# - strip = "symbols": cuts shipped size ~22% (tarball ~10%). Panic messages
#   keep their file:line locations (compiled-in string constants via
#   #[track_caller]); only RUST_BACKTRACE=1 symbolization is lost, and nothing
#   in the daemon emits backtraces. Keep .deb/.rpm/tarball uniform: the RPM
#   path disables brp post-install processing (__os_install_post %{nil}) so
#   rpm never re-processes these already-stripped binaries.
# - NO panic = "abort": the daemon isolates request-worker panics with
#   catch_unwind (sessions.rs) — abort would turn any single request panic
#   into a whole-daemon crash.
#
# rustflags: -Zunstable-options + --jobs-frontend=0 (same parallel-frontend
# flag as dev — 0 = available_parallelism, the self-tuning "auto"),
# auto-applied under the nightly default toolchain, plus
# -C target-cpu=native (local-machine tuning — same rationale and the same
# dist/publish exclusion as the dev profile; see the dev-profile note above).
# No -Zshare-generics here — see the dev-profile note above.
[profile.release]
strip = "symbols"
rustflags = ["-Zunstable-options", "--jobs-frontend=0", "-C", "target-cpu=native"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
choreo-ai-protocols = { path = "choreo-ai-protocols", version = "0.1" }
choreo-blockchain = { path = "choreo-blockchain", version = "0.1" }
choreo-client-core = { path = "choreo-client-core", version = "0.1" }
choreo-content = { path = "choreo-content", version = "0.1" }
choreo-keystore = { path = "choreo-keystore", version = "0.1" }
choreo-proto = { path = "choreo-proto", version = "0.1" }
choreo-sanitize = { path = "choreo-sanitize", version = "0.1" }
choreo-image = { path = "choreo-image", version = "0.1" }
choreo-im = { path = "choreo-im", version = "0.1" }
choreo-markdown = { path = "choreo-markdown", version = "0.1" }
choreo-mcp = { path = "choreo-mcp", version = "0.1" }
choreo-transport = { path = "choreo-transport", version = "0.1" }
ureq = { version = "3", features = ["json", "brotli", "multipart"] }
ammonia = "4"
base64 = "0.23"
dirs = "6"
redb = "4"
# Raster image codecs. Trimmed from default (which would pull the AVIF
# *encoder* `ravif` — dead weight, since we only ever re-encode to PNG/JPEG).
# `avif-native` (dav1d decode) is NOT enabled here: it is gated behind the
# `avif` feature on each consumer, so the default/release build stays C-free
# (see the release.sh static-musl rationale).
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "rayon"] }
# Pure-Rust HEIC/HEIF still-image decoder (ISOBMFF container + HEVC via
# rust_h265). Built in unconditionally: no C dependencies, so it does NOT
# threaten the static-musl release build. Used by both choreo-daemon (read_img
# normalization + display_image dimension inspection) and choreo-tui (client
# display decode).
heif-oxide = "0.1"
rand = "0.10"
resvg = "0.48"
serde_json = "1"
schemars = { version = "1.2.1", features = ["derive"] }
yaml_serde = "0.10"
signal-hook = "0.4"
serial_test = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "1.1"
lru = "0.18"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.10"
sha2 = "0.11"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# zstd compression for the `session_turns` table values — the bulk of the DB
# (conversation text, tool output, reasoning artifacts). Compression is applied
# to the whole MessagePack-serialized turn AFTER serialization (never per-field,
# which would fragment the compression window); the 1→2 schema migration
# re-encodes pre-existing rows. See choreo-daemon/src/db/codec.rs.
#
# Pure-Rust implementation (no libzstd C build): emits and reads standard zstd
# frames, so the on-disk schema-2 contract is unchanged. Numeric compression
# levels 1–22 map to C zstd numbering (COMPRESSION_LEVEL=6 keeps the tuned
# speed/ratio trade-off). Apache-2.0, matching the workspace license.
structured-zstd = "0.0.49"
# MessagePack (named mode) for anything that crosses a language boundary:
# the client↔daemon wire and DB values. Named encoding (struct fields as map
# keys, enum variants by name) gives JSON-grade evolution safety in a compact
# binary format with universal language support. Pin 1.3: name-based enum
# encoding is new in this line. postcard stays for the Rust-only VM and
# credential channels (see ARCHITECTURE.md).
rmp-serde = "1.3"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
# Multi-producer/single-consumer channels with `select!` — the event-driven
# replacement for `recv_timeout` polling when a thread must wait on several
# channels at once (cancellation alongside tool results / SSE events).
crossbeam-channel = "0.5"
snow = "0.10"
url = "2"
# Windows Unix domain sockets (std::os::windows::net::UnixStream is still
# unstable — `windows_unix_domain_sockets`, E0658, rust-lang/rust#150487).
# uds_windows provides the same bind/connect/try_clone/shutdown API over named
# pipes; used cfg(windows) only, never on Unix.
uds_windows = "1.2.1"
humfmt = "0.6.0"
hex = "0.4"
# Substrate client (native/light + JSON-RPC) — promoted to the workspace now
# that BOTH choreo-blockchain (the `blockchain` feature) and choreo-content (the
# always-on Coordination Platform tools) use it.
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee", "runtime"] }
# sr25519 signing + Polkadot-JS keystore compat — used by choreo-keystore for
# the Polkadot account store (the `polkadot-js-compat` feature pulls scrypt,
# crypto_secretbox, and schnorrkel transitively).
subxt-signer = { version = "0.50.3", default-features = false, features = ["polkadot-js-compat", "subxt"] }
# Protobuf content protocol (choreo-content's ItemMessage/mixin encoding).
prost = "0.14"
# SCALE encoding for deterministic item-id derivation (choreo-content).
parity-scale-codec = "3"
# Substrate blake2_256 for item-id derivation (choreo-content).
sp-crypto-hashing = "0.1"
# Base58 for the content protocol's CID <-> sha2-256-digest conversion (choreo-content).
bs58 = "0.5"
# Synchronous WebSocket client for the indexer's JSON-RPC API (choreo-content).
# No default features: the indexer endpoint is plain `ws://`, so neither
# native-tls nor rustls is needed (and native-tls would drag a C/OpenSSL build
# into the static-musl release). `handshake` enables `tungstenite::connect`.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
nix = "0.31.3"
unicode-segmentation = "1.13"
# Filesystem notification for the user-overlay watcher (S4). 8.2.0 is the
# latest stable; 9.0.0-rc.x is a pre-release and is deliberately NOT used.
notify = "8.2.0"
# Unicode general-category property (consumed by choreo-sanitize, the leaf
# crate that owns the shared spoofing predicates and output byte budget):
# generated from the Unicode data tables, so the Cf set used to escape
# invisible format characters stays complete across Unicode releases without
# a hand-maintained enumeration.
unicode-general-category = "1.1"
