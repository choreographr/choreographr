[workspace]
members = [
    "tai-client-core",
    "tai-daemon",
    "tai-keystore",
    "tai-proto",
    "tai-tui",
    "tai-dioxus",
    "tai-im",
]
resolver = "3"

[workspace.dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tai-client-core = { path = "tai-client-core" }
tai-keystore = { path = "tai-keystore" }
tai-proto = { path = "tai-proto" }
tai-im = { path = "tai-im" }
tokio = { version = "1" }
