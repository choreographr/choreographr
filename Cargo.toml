[workspace]
members = [
    "tai-client-core",
    "tai-daemon",
    "tai-proto",
    "tai-sh",
    "tai-dioxus",
]
resolver = "3"

[workspace.dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tai-client-core = { path = "tai-client-core" }
tai-proto = { path = "tai-proto" }
tokio = { version = "1" }
