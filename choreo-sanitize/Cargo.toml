[package]
name = "choreo-sanitize"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# Internal leaf crate, but published to crates.io (`publish = true`): the
# workspace members that depend on it (daemon, TUI, blockchain, client-core,
# choreo-mcp) must be able to resolve it in released form, and cargo-release's
# publish verification rejects unpublished workspace deps — keeping this crate
# unpublished blocked Phase 2. It is the single source of truth for the Unicode
# "spoofing" predicates (which chars may reorder, hide, or fake text in
# rendered output), the shared tool-output byte budget, and the code-injection
# environment set stripped from spawned children (the shell/exec tool and the
# MCP stdio child). Keeping these in one leaf crate means a Unicode table bump
# (via `unicode-general-category`), a budget change, or an added injection
# variable is applied everywhere at once, and the code-space sweep test that
# guards the predicate lives next to it.
publish = true

[dependencies]
unicode-general-category.workspace = true

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
