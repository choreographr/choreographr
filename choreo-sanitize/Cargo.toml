[package]
name = "choreo-sanitize"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# Internal leaf crate — never published to crates.io. It is the single source
# of truth for the Unicode "spoofing" predicates (which chars may reorder,
# hide, or fake text in rendered output) and the shared tool-output byte
# budget, used by the daemon (line/transcript sanitizers + streaming caps),
# the TUI (terminal sink filter), the blockchain tools (node-output
# sanitizer), and the client (live streaming cap). Keeping these in one leaf
# crate means a Unicode table bump (via `unicode-general-category`) or a
# budget change is applied everywhere at once, and the code-space sweep test
# that guards the predicate lives next to it.
publish = false

[dependencies]
unicode-general-category.workspace = true
