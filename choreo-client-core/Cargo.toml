[package]
name = "choreo-client-core"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]

choreo-proto.workspace = true
choreo-sanitize.workspace = true
choreo-transport.workspace = true
choreo-keystore.workspace = true
postcard.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
# known_servers.toml — the client's pinned server public keys (SSH
# known_hosts analogue). toml parses/persists the store; base64 decodes
# the pinned pubkeys (same standard-alphabet convention as the daemon ACL
# and the fingerprint renderer).
toml.workspace = true
base64.workspace = true
# KnownServerEntry derives Serialize/Deserialize for the TOML store.
serde.workspace = true
# Feature-gated test-only helpers (src/test_support.rs): a regular OPTIONAL
# dependency (not a dev-dependency) because other crates' test builds consume
# it through their dev-dependency feature request on this crate.
tempfile = { workspace = true, optional = true }
# Keystore unlock-key derivation (TOFU design): the AddCredential unlock key's
# X25519 public key is what credential blobs are encrypted with.
x25519-dalek.workspace = true
rand.workspace = true

# Windows Unix domain sockets (std::os::windows::net::UnixStream is still
# unstable); see the workspace-level comment. Unix-only builds never compile it.
[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true

[dev-dependencies]
# Own tests also use tempfile directly; duplicated with the optional dep
# because the optional one is for the feature-gated test_support module.
tempfile.workspace = true
# Integration tests (tests/first_contact.rs) generate X25519 server keypairs
# for the hand-rolled responder threads and read the client's transport
# keypair override from choreo-transport.
x25519-dalek.workspace = true
rand.workspace = true

[features]
# FOR TESTS ONLY — never enabled by production consumers; see src/test_support.rs.
test-support = ["dep:tempfile"]
