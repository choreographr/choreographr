[package]
name = "choreo-client-core"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]

choreo-proto.workspace = true
choreo-sanitize.workspace = true
choreo-transport.workspace = true
choreo-keystore.workspace = true
# Shared OIDC `id_token` claim extraction (`choreo_shared::oauth_claims`), reused
# under the `oauth` namespace so login and refresh decode claims one way.
choreo-shared.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
# known_servers.toml — the client's pinned server public keys (SSH
# known_hosts analogue). toml parses/persists the store; base64 decodes
# the pinned pubkeys (same standard-alphabet convention as the daemon ACL
# and the fingerprint renderer).
toml.workspace = true
base64.workspace = true
# KnownServerEntry derives Serialize/Deserialize for the TOML store.
serde.workspace = true
# In-process transport (ConnectionMode::InProcess): the raw crossbeam channel
# ends from an embedded daemon's EmbeddedLink are moved in as values; the pump
# forwards messages without any codec. Already a workspace dependency (the
# TUI and the daemon's embedded transport use it).
crossbeam-channel.workspace = true
# Feature-gated test-only helpers (src/test_support.rs): a regular OPTIONAL
# dependency (not a dev-dependency) because other crates' test builds consume
# it through their dev-dependency feature request on this crate.
tempfile = { workspace = true, optional = true }
# The auto-bind path mints a fresh CSPRNG keystore binding key with `rand`.
rand.workspace = true
# Provider OAuth login library (src/oauth/): PKCE S256 uses `sha2`; the
# loopback callback server uses `tiny_http` (a `recv_timeout` accept loop that
# polls the cancel flag); `webbrowser` opens the authorize URL best-effort; the
# blocking HTTPS token / device-code exchanges use `ureq` (already in the
# tree); `serde_json` reads the token response and the JWT identity claims.
tiny_http.workspace = true
webbrowser.workspace = true
sha2.workspace = true
ureq.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Own tests also use tempfile directly; duplicated with the optional dep
# because the optional one is for the feature-gated test_support module.
tempfile.workspace = true
# Integration tests (tests/it/first_contact.rs) generate X25519 server keypairs
# for the hand-rolled responder threads and read the client's transport
# keypair override from choreo-transport.
x25519-dalek.workspace = true
rand.workspace = true

[features]
# FOR TESTS ONLY — never enabled by production consumers; see src/test_support.rs.
test-support = ["dep:tempfile"]

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
