# MSRV-aware dependency resolution: when cargo resolves dependencies it prefers
# versions whose declared `rust-version` is compatible with the workspace's
# minimum supported Rust version (1.94.1, see the root Cargo.toml). If no
# compatible version satisfies a requirement, fall back to the newest version
# and emit a warning instead of failing the build. This is a stable Cargo
# feature and works identically on nightly and stable.
[resolver]
incompatible-rust-versions = "fallback"

# cargo-nextest convenience aliases (the parallel test runner). They mirror the
# README's libtest split (`cargo test` = unit tests, `-- --ignored` = integration
# tests) while running every test in its own process, in parallel, across all
# 16-ish cores. `--run-ignored only` matches libtest's `--ignored` semantics.
#
# `--all-features` keeps feature-gated code exercised: the metrics, blockchain,
# and mimalloc features (all off by default) get compiled and their tests run —
# running the suite with all features on is what keeps those paths in CI. The
# native PDF tools need no feature: pdf-inspector is an unconditional dependency.
#
# `test-lean` is the complement: it runs the unit suite with every optional
# feature off (the default configuration). That is the only way the metrics
# no-op stub backend and the feature-off `--metrics-addr` refusal in
# `server/lifecycle.rs` get compiled — the `--all-features` aliases never build
# that path, so `test-lean` guards against the stub signatures drifting apart
# from the real backend.
[alias]
test-fast = "nextest run --workspace --all-features"                 # unit tests
# unit tests with every optional feature off (metrics/blockchain/mimalloc stubs)
test-lean = "nextest run --workspace"
# integration tests (the #[ignore] suite)
test-integration = "nextest run --workspace --all-features --run-ignored only"
# everything: unit + integration in one pass
test-all = "nextest run --workspace --all-features --run-ignored all"

# Per-profile rustflags (unstable Cargo feature, nightly-only). This opt-in is
# what lets the root Cargo.toml scope `-Z` compiler flags by profile —
# `-Zshare-generics=yes` in [profile.dev] only, `--jobs-frontend=16` in dev and
# release — so EVERY adhoc `cargo` command (including per-crate `-p x` builds
# and `cargo test` / `cargo nextest run`) automatically builds fast under the
# nightly default toolchain (see rust-toolchain.toml). An LLM/agent issuing raw
# `cargo` commands needs to know nothing: the flags just apply.
#
# This block, plus the per-profile `rustflags` keys it enables, HARD-BLOCKS
# stable Cargo. Stable builds are therefore an explicit opt-out, run through
# scripts/build-stable.sh (`just build-stable` / `check-stable` / `test-stable`),
# which temporarily strips these nightly-only bits, runs `cargo +stable ...`,
# and restores them. Note: profile rustflags replace [build] rustflags but
# concatenate with [target.'cfg(...)'] rustflags, so per-machine linker flags
# (e.g. the wild-linker flags in ~/.cargo/config.toml) still apply.
[unstable]
profile-rustflags = true
