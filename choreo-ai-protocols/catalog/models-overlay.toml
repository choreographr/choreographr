# models-overlay.toml — bundled policy layer over the models.dev base catalog.
#
# The catalog is a two-layer pipeline (see src/catalog/loader.rs):
#
#   catalog/models.dev.json ──catalog-gen──► catalog/catalog.bin   (base, embedded)
#   catalog/models-overlay.toml ──include_str!──► merged at load time
#
# This file carries EVERYTHING that is not derivable from the models.dev
# snapshot:
#
#   1. Provider-level policy for models.dev-covered providers — protocol /
#      max_tokens_field / base_url / default_model where the hand-curated
#      TOML catalog set a value that differs from the derived default (the
#      models.dev `api`, the first models.dev model, or the npm-derived
#      protocol). The overlay is authoritative for endpoint policy; models.dev
#      is authoritative for facts.
#   2. Per-model exceptions — passback pins (Anthropic last-turn-only
#      models), Responses-API flags models.dev cannot express, and the two
#      claude-opus-4-1 models the snapshot dropped (carried wholesale from the
#      old anthropic.toml so they stay selectable).
#   3. Providers models.dev does not cover — defined WHOLESALE with their
#      full model lists, verbatim from their old TOMLs.
#
# Merge semantics (merge_overlay in src/catalog/overlay.rs):
#   - provider scalars: field-wise replace, omitted fields fall through
#   - per-model entries: field-wise replace onto the base entry (new keys add)
#   - unknown keys: warn + skip, never fatal
#
# Schema (bundled layer; S4's user overlay uses the identical schema):
#
#   [provider.<slug>]
#   protocol = "openai" | "anthropic" | "google"
#   max_tokens_field = "max_completion_tokens" | "max_tokens"
#   base_url = "https://…"
#   default_model = "…"
#   display_name = "…"          # only needed for providers not in the base
#
#   [provider.<slug>.models."<model>"]
#   context_window = 123456
#   reasoning_supported = true
#   reasoning_levels = ["off", "high", "max"]
#   responses = true
#   reasoning_passback = "tool_loop" | "all_turns" | "none" | "signature" | "response_id"

