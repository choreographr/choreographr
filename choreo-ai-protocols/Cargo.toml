[package]
name = "choreo-ai-protocols"
version.workspace = true
# Kept as this crate's own description (instead of inheriting the generic
# workspace one): it names the concrete provider protocols and the
# ProviderClient trait, which is genuinely useful metadata on crates.io.
# All other crates.io-required fields are inherited from the workspace.
description = "Provider protocols for Choreographr — OpenAI-compatible, Anthropic Messages, and Google Gemini clients, the ProviderClient trait, and the provider catalog"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[lib]
name = "choreo_ai_protocols"

[dependencies]
# Atomic runtime swap of the process-wide provider catalog (see
# `catalog/mod.rs`); previously a transitive dependency, promoted so the
# ArcSwap global is a declared direct dependency.
anyhow.workspace = true
arc-swap.workspace = true
# Base64-encode image bytes into `data:` URLs for the vision content parts
# (`image_url` on OpenAI chat/Responses, `image.source.data` on Anthropic,
# `inline_data.data` on Google).
base64.workspace = true
choreo-proto.workspace = true
# RFC 7231 Retry-After headers arrive in two forms: delta-seconds (the
# common one) or an HTTP-date (`Wed, 21 Oct 2015 07:28:00 GMT`).  chrono is
# already a workspace dependency (daemon + TUI) and parses the strict
# IMF-fixdate form the spec requires servers to send.
chrono.workspace = true
crossbeam-channel.workspace = true
# Ordered maps for the models.dev normalization: the snapshot's JSON object
# order is load-bearing (the `default_model` is the FIRST model in a
# provider's models map), so providers and models must be deserialized in
# insertion order, not BTreeMap order. Already in the dependency tree
# (2.14.0 via ratatui/serde_json transitive deps); the `serde` feature lets
# serde deserialize straight into `IndexMap`.
indexmap = { version = "2.14", features = ["serde"] }
# Serialize the normalized models.dev base into the embedded `catalog.bin`
# (postcard, the same format the S4 runtime cache will use — one load path).
postcard.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# Atomic artifact writes: temp file in the same dir → fsync → rename (see
# `catalog/persist.rs`), used by `catalog-gen` for `catalog.bin` and the
# gitignored snapshot cache.
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# Fmt-subscriber init for the `catalog-gen` binary (stdout stays a clean,
# paste-able data contract; diagnostics go through tracing). Bins cannot use
# dev-dependencies, so this lives in [dependencies].
tracing-subscriber.workspace = true
ureq.workspace = true
zeroize.workspace = true

# Generator binary: regenerates `catalog/catalog.bin` from the local
# `catalog/models.dev.json` snapshot (a gitignored, offline-cached fetch of
# the models.dev API — `catalog-gen` fetches it when missing) + the bundled
# `catalog/models-overlay.toml`. `catalog.bin` is the only committed catalog
# data file. Re-runnable via `cargo run --bin catalog-gen` (see the bin's
# module docs).
[[bin]]
name = "catalog-gen"
path = "src/bin/catalog-gen.rs"

[features]
# Test-only: exposes the shared scripted HTTP mock provider (`test_utils::
# MockProvider`) used by the reasoning round-trip wire tests in this crate's
# tests/ and choreographr's tests/. Enabled for test builds via the self
# dev-dependency below, so it never leaks into the published public API.
test-utils = []

[dev-dependencies]
# Enable the `test-utils` feature when building tests/examples/benchmarks for
# this package (a package may depend on itself in dev-dependencies).
choreo-ai-protocols = { path = ".", features = ["test-utils"] }
# Serialize the catalog unit tests that read/mutate the `PROVIDER_CATALOG`
# process global (the `replace_catalog` swap tests + direct catalog readers),
# so they stay deterministic when the libtest runner shares one process.
serial_test.workspace = true
