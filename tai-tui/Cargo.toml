[package]
name = "tai-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
image = "0.25"
ratatui = "0.30.1"
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm", "image-defaults"] }
resvg = "0.45"
tai-client-core.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2"
tai-proto.workspace = true
tokio = { workspace = true, features = ["full"] }
