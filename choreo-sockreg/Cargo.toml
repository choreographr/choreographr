[package]
name = "choreo-sockreg"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# Published despite being an internal leaf crate: choreo-ai-protocols depends
# on it, and cargo refuses to publish a crate whose dependencies are not on
# crates.io — keeping this `publish = false` blocks the whole release.
publish = true

[features]
default = []
# Pulls in ureq and provides `RegisteringTcpConnector`, a drop-in Connector
# that dials TCP like ureq's own TcpConnector but also tunes keepalives and
# registers a duplicate of every live socket in a SocketRegistry.
ureq = ["dep:ureq"]

[dependencies]
tracing.workspace = true
# nix does not build on non-Unix targets at all, so it is target-gated; Windows
# now has a real Winsock implementation of the same API (see lib.rs).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["socket", "net", "fs"] }

# Winsock FFI for the Windows path: shutdown/recv/WSAPoll/setsockopt/
# WSAIoctl live in WinSock; WSAIoctl's signature also names
# Win32_System_IO::OVERLAPPED, so that feature is required too.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
# crossbeam per the AGENTS.md house rule: cross-thread messaging (the
# reader-thread handshake in `tests/windows_registry.rs`) always uses
# crossbeam_channel, never std::sync::mpsc — here only as a test dependency,
# since the library itself is threadless by design.
crossbeam-channel.workspace = true

[dependencies.ureq]
workspace = true
optional = true

# Gated so a plain `cargo test` (no features) never tries to build the ureq
# integration test against an absent dependency.
[[test]]
name = "ureq_connector"
required-features = ["ureq"]

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
