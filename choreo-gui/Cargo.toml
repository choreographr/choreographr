[package]
name = "choreo-gui"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# The GUI is not part of the shipped suite or the crates.io publish set.
publish = false

# The GUI is intentionally NOT part of the prebuilt release artifacts
# (tarball/.deb/.rpm/Homebrew/AUR ship the daemon, TUI, and bridges only) — it
# is a stub and not part of the shipped suite, so it has no place in the lean
# default install. It also stays off crates.io (`publish = false` above), so
# there is no `cargo install choreo-gui`; build it from the workspace tree if
# you want the GUI.

# The cdylib exists solely for the Android gradle/dx scaffold, which loads the
# crate as a `.so` via `System.loadLibrary` to drive the Dioxus Native app. It
# is inert on desktop builds (nothing links against the dynamic target there).
[lib]
crate-type = ["lib", "cdylib"]
[[bin]]
name = "choreo-gui"
path = "src/bin/choreo-gui.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
# Wipe the pending unlock key (secret material) when a rejection discards it.
zeroize.workspace = true
# Dioxus 0.7 Native renderer (Blitz/wgpu) instead of the desktop/webview
# renderer: it is ALSO the Android renderer, so one renderer serves desktop and
# aarch64-linux-android alike — there is no webview (webkit2gtk, etc.) anywhere
# in the dependency tree. The platform-agnostic `launch` facade maps to
# dioxus_native under the `native` cfg, so no per-platform entry code is needed.
dioxus = { version = "0.7", features = ["native"] }
futures-channel.workspace = true
futures-util.workspace = true
humfmt.workspace = true
choreo-client-core.workspace = true
choreo-keystore.workspace = true
choreo-markdown.workspace = true
choreo-proto.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Android-only entry glue (see android_main in lib.rs): android-activity gives
# us the `AndroidApp` argument type of the `android_main` symbol the native
# runtime calls, and blitz-shell (dioxus-native's shell layer) exposes the
# `set_android_app` slot its event-loop factory reads on Android. Versions
# match the ones dioxus-native/winit already resolve to (blitz-shell 0.2,
# android-activity 0.6, native-activity flavor), so Cargo unifies them into a
# single crate — the AndroidApp type identity must be shared for the slot to
# accept the handle we pass.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
blitz-shell = "0.2"
