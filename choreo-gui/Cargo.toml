[package]
name = "choreo-gui"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# The GUI is not part of the shipped suite or the crates.io publish set.
publish = false

# The desktop GUI is intentionally NOT part of the prebuilt release artifacts
# (tarball/.deb/.rpm/Homebrew/AUR ship the daemon, TUI, and bridges only) — it
# is a stub and drags in the dioxus/webkit2gtk native-widget tree, which has no
# place in the lean default install. It also stays off crates.io (`publish =
# false` above), so there is no `cargo install choreo-gui`; build it from the
# workspace tree if you want the GUI.
[[bin]]
name = "choreo-gui"
path = "src/bin/choreo-gui.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
dioxus = { version = "0.7", features = ["desktop"] }
futures-channel.workspace = true
futures-util.workspace = true
humfmt.workspace = true
choreo-client-core.workspace = true
choreo-keystore.workspace = true
choreo-markdown.workspace = true
choreo-proto.workspace = true
tracing.workspace = true
