[package]
name = "choreo-gui"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# The GUI is not part of the shipped suite or the crates.io publish set.
publish = false

# The GUI is intentionally NOT part of the prebuilt release artifacts
# (tarball/.deb/.rpm/Homebrew/AUR ship the daemon, TUI, and bridges only) — it
# is a stub and not part of the shipped suite, so it has no place in the lean
# default install. It also stays off crates.io (`publish = false` above), so
# there is no `cargo install choreo-gui`; build it from the workspace tree if
# you want the GUI.

# The cdylib exists solely for the Android gradle/dx scaffold, which loads the
# crate as a `.so` via `System.loadLibrary` to drive the Dioxus Native app. It
# is inert on desktop builds (nothing links against the dynamic target there).
# iOS does NOT use this target: the Xcode scaffold (scripts/build-ios.sh) links
# the static `lib` (rlib) target via a C bootstrap (ios/main.m) that calls the
# `choreo_gui_ios_main` trampoline — so no `staticlib` crate-type is added
# today; revisit only if the Xcode link needs one.
[lib]
crate-type = ["lib", "cdylib"]
[[bin]]
name = "choreo-gui"
path = "src/bin/choreo-gui.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
# Wipe the pending unlock key (secret material) when a rejection discards it.
zeroize.workspace = true
# Dioxus 0.7 Native renderer (Blitz/wgpu) instead of the desktop/webview
# renderer: it is ALSO the Android and iOS renderer, so one renderer serves
# desktop and aarch64-linux-android alike — there is no webview (webkit2gtk,
# etc.) anywhere in the dependency tree. The platform-agnostic `launch`
# facade maps to dioxus_native under the `native` cfg, so no per-platform
# entry code is needed.
dioxus = { version = "0.7", features = ["native"] }
futures-channel.workspace = true
futures-util.workspace = true
humfmt.workspace = true
choreo-client-core.workspace = true
choreo-keystore.workspace = true
choreo-markdown.workspace = true
choreo-proto.workspace = true
# GUI preference storage (src/settings.rs): serde for the settings struct,
# toml for the gui-settings.toml file. Unconditional deps (the settings
# module compiles on every target) — both are already workspace deps consumed
# elsewhere, so no new supply-chain surface.
serde.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Pulls in the shared test-only config-root fixture from choreo-client-core.
choreo-client-core = { workspace = true, features = ["test-support"] }

# Android-only entry glue (see android_main in lib.rs): android-activity gives
# us the `AndroidApp` argument type of the `android_main` symbol the native
# runtime calls, and blitz-shell (dioxus-native's shell layer) exposes the
# `set_android_app` slot its event-loop factory reads on Android. Versions
# match the ones dioxus-native/winit already resolve to (blitz-shell 0.2,
# android-activity 0.6, native-activity flavor), so Cargo unifies them into a
# single crate — the AndroidApp type identity must be shared for the slot to
# accept the handle we pass.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
blitz-shell = "0.2"

# iOS-only: the embedded in-process daemon (choreo-daemon::embedded). Target-
# gated so desktop and Android builds neither link nor compile-reach any of it
# — a plain host build has no `choreo_daemon` symbols in this crate at all.
# The GUI opens daemon state (Mobile tool policy: no shell/exec/RISC-V tools,
# no MCP subprocess spawning — sandbox-safe) and talks to the daemon core over
# plain channels (ConnectionMode::InProcess). See lib.rs's
# `embedded_connection_mode`.
[target.'cfg(target_os = "ios")'.dependencies]
# default-features = false: drops choreo-daemon's `pdf` feature (see its
# Cargo.toml) — pdf-inspector's build script links a C dylib for the Apple
# target, which the Linux compile-validation shim path cannot do, and a
# mobile daemon has no use for a desktop PDF parser anyway. Everything else
# the embedded daemon needs (DB, accounts, catalog, tools, transport) is
# unconditional.
choreo-daemon = { workspace = true }
# The iOS bridge (src/ios_bridge.rs): crossbeam one-shot reply channels
# across the C ABI (the boxed Sender travels to Swift and comes back through
# choreo_ios_tool_reply), and serde_json for the reply payload decode.
# Leaf-crate note (AGENTS.md): this is the documented exception where the
# bridge contract itself mandates crossbeam — the channel type is fixed by
# choreo-daemon's ToolBridgeReply shape.
crossbeam-channel.workspace = true
serde_json.workspace = true

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
