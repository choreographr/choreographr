[package]
name = "choreo-proto"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
rmp-serde.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Windows Unix domain sockets: std::os::windows::net::UnixStream is still
# unstable, so the crate's `UnixStream` re-export / `connect_unix` dial uses
# the uds_windows shim on Windows. Unix-only builds never compile it.
[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
