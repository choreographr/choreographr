[package]
name = "tai-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
base64.workspace = true
bytes = "1"
dirs.workspace = true
fff-search = "0.9"
hex = "0.4"
futures-util.workspace = true
gix = { version = "0.85", features = ["tree-editor"] }
hmac = "0.13"
image.workspace = true
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
alloy = { version = "2.1", features = ["providers", "rpc-types-eth", "sol-types"] }
url = "2"
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee", "runtime"] }
tai-keystore.workspace = true
tai-proto.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "1.1"
tracing.workspace = true
tracing-subscriber.workspace = true
