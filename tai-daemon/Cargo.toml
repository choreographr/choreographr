[package]
name = "tai-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
dirs = "6"
fff-search = "0.9"
hex = "0.4"
futures-util.workspace = true
gix = { version = "0.85", features = ["tree-editor"] }
hmac = "0.13"
image = "0.25"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
resvg = "0.47"
serde.workspace = true
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
alloy = { version = "2.1", features = ["full"] }
url = "2"
subxt = { version = "0.50", default-features = false, features = ["native", "jsonrpsee", "runtime"] }
tai-keystore.workspace = true
tai-proto.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
