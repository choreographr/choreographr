[package]
name = "choreo-shared"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

# A deliberately tiny, *leaf* crate: the small binary-facing helpers that every
# CLI crate in the workspace used to duplicate (release-name metadata, the
# shared clap styling, the `-v`/`-q` verbosity handling) plus the shared
# serializable domain type `ServiceCredential`. It holds no transport logic —
# `choreo-proto` remains the wire protocol — so it stays cheap to depend on
# from every binary.
[dependencies]
# The OAuth claim decoders (`oauth_claims`): base64url-decoding an `id_token`
# payload and reading its JSON claims. Both are already in every binary's tree.
base64.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# The hardened log-file opener (O_NOFOLLOW + euid check) is Unix-only; Windows
# builds inherit the parent directory's ACLs instead and pull no rustix.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
