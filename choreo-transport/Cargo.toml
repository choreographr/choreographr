[package]
name = "choreo-transport"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
choreo-proto.workspace = true
choreo-shared.workspace = true
thiserror.workspace = true
tracing.workspace = true
snow.workspace = true
x25519-dalek.workspace = true
rand.workspace = true
# Zeroize the reusable plaintext staging buffer after each send, so a sent
# message's plaintext does not linger in the reused buffer until the next send.
zeroize.workspace = true
# The crate's one textual key form: standard-alphabet base64 of a 32-byte key,
# shared by the public key an ACL entry enrolls, the `known_servers.toml` pin and
# the on-disk secret.
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Used only to shrink the test sockets' kernel send/recv buffers (SO_SNDBUF /
# SO_RCVBUF) in tests/it/common.rs — TcpStream has no stable API for these.
# nix's default features are empty, so opt into the socket feature explicitly.
nix = { workspace = true, features = ["socket"] }

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
