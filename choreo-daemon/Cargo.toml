[package]
name = "choreo-daemon"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[lib]
name = "choreo_daemon"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
zlob = "1.6"
grep-regex = "0.1"
grep-searcher = "0.1"
hex.workspace = true
# Type-safe syscall bindings for the process-control path (kill/pgid/pidfd),
# the bounded pipe-drain poll loop, and the non-blocking fcntl on child pipes.
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }

gix = { version = "0.86", features = ["tree-editor", "revision"] }
gix-imara-diff = { version = "0.2", features = ["unified_diff"] }
hmac = "0.13"
image.workspace = true
rand.workspace = true
redb.workspace = true
tiktoken = "3.5"
ureq.workspace = true
url.workspace = true
resvg.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
thiserror.workspace = true
sha1 = "0.11"
sha2.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
zeroize.workspace = true
humfmt.workspace = true
choreo-keystore.workspace = true
choreo-mcp.workspace = true
choreo-proto.workspace = true
choreo-sanitize.workspace = true
choreo-transport.workspace = true
choreo-ai-protocols.workspace = true
signal-hook.workspace = true
notify.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
# OpenMetrics / Prometheus monitoring.
# The `process` feature exposes process-level metrics (RSS, CPU, FD count)
# alongside our application-level gauges, counters, and histograms.
# Both are optional, pulled in by the `metrics` feature (off by default) so a
# plain build drops the whole prometheus/tiny_http tree.
prometheus = { version = "0.14", features = ["process"], optional = true }
tiny_http = { version = "0.12", optional = true }
# Blockchain tools (EVM via alloy, Substrate/Polkadot via subxt). The tool
# implementations — and the tokio sidecar runtime they need — live in the
# `choreo-blockchain` crate, so tokio/alloy/subxt are never direct deps here.
# This optional dep is enabled by the `blockchain` feature (off by default).
choreo-blockchain = { workspace = true, optional = true }
ckb-vm = { version = "0.24.14", features = ["detect-asm"] }
tempfile.workspace = true
postcard.workspace = true
rmp-serde.workspace = true
# Native PDF parsing (pdf_classify / pdf_to_markdown), behind the `pdf` feature.
#
# This is a REGISTRY dep (`pdf-inspector = "0.1"`) — deliberately NOT a git pin,
# because crates.io refuses to publish crates whose manifests reference git
# sources. The security pin lives in the workspace root's `[patch.crates-io]`
# (see the root Cargo.toml), which redirects this crates.io version to a
# contributor fork for local/release builds: upstream (firecrawl/pdf-inspector)
# still ships lopdf ^0.41.0, vulnerable to RUSTSEC-2026-0187 — a ~21 KB crafted
# PDF with ~10,000-deep nested objects aborts the process via stack overflow,
# a SIGABRT that `catch_unwind` CANNOT intercept. The fork bumps lopdf to 0.42.0
# (MAX_NESTING_DEPTH), verified source-compatible with 860 green tests and a
# clean error instead of SIGABRT on the PoC (upstream PR
# firecrawl/pdf-inspector#198, omeileo commit f86decf).
#
# The feature is off by default: a `cargo install` from crates.io has no
# `[patch]` available (patches are workspace-local and never published), so it
# resolves the unpatched registry version — shipping the PDF tools unpatched
# would re-introduce the RUSTSEC-2026-0187 crash surface. Re-checked 2026-08-09:
# crates.io pdf-inspector 0.1.7 (latest, published 2026-07-31) still depends on
# lopdf ^0.41.0, so the fork pin stays. Once upstream publishes with lopdf
# >= 0.42: drop the `[patch.crates-io]` entry from the root Cargo.toml, turn
# this back into a plain dependency, and remove the `pdf` feature gate.
pdf-inspector = { version = "0.1", optional = true }

[features]
# Prometheus/OpenMetrics instrumentation and the `/metrics` HTTP server
# (src/metrics.rs). Off by default (like `pdf`): a plain build compiles it
# out entirely (no prometheus/tiny_http dependencies), and release binaries
# opt in via `scripts/release.sh --features pdf,metrics,blockchain`. The module's public
# API degrades to no-op stubs when disabled, so the daemon's instrumentation
# call sites compile unchanged in both configurations — and `--metrics-addr`
# then fails startup with a clear error instead of being silently ignored.
metrics = ["dep:prometheus", "dep:tiny_http"]
# Native PDF tools (pdf_classify / pdf_to_markdown). Off by default so the
# published manifest stays free of the git-pinned fork (crates.io rejects git
# dependencies); release binaries are built with `--features pdf,metrics,blockchain` and get the
# fork via the workspace `[patch.crates-io]`. See the pdf-inspector comment
# above for the security rationale and the revert path.
pdf = ["dep:pdf-inspector"]
# EVM (alloy) and Substrate/Polkadot (subxt) blockchain tools. Off by default:
# enabling it pulls in the choreo-blockchain crate (tokio + alloy/subxt client
# stacks) that a plain build has no use for. Opt in with `--features blockchain`
# (or the root package's `blockchain` feature, which forwards here).
blockchain = ["dep:choreo-blockchain"]
# Test-only: exposes the bounded-shutdown seam (`join_session_shutdown_with_grace_for_test`)
# used by tests/session_shutdown.rs.  Enabled for test builds via the self
# dev-dependency below, so it never leaks into the published public API.
test-utils = []

[dev-dependencies]
filetime = "0.2"
serial_test.workspace = true
# Enable the `test-utils` feature when building tests/examples/benchmarks for
# this package (a package may depend on itself in dev-dependencies).
choreo-daemon = { path = ".", features = ["test-utils"] }
# The shared scripted HTTP mock provider for the reasoning round-trip wire
# tests lives in choreo-ai-protocols behind its `test-utils` feature.
choreo-ai-protocols = { workspace = true, features = ["test-utils"] }
# The real client-side connection library used by the daemon<->client
# integration tests (tests/daemon_client_unix.rs, tests/daemon_client_noise.rs).
choreo-client-core.workspace = true
