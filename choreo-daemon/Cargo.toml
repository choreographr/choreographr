[package]
name = "choreo-daemon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "choreographr"
path = "src/main.rs"

[lib]
name = "choreographr"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
base64.workspace = true
dirs.workspace = true
zlob = "1.6"
grep-regex = "0.1"
grep-searcher = "0.1"
hex = "0.4"
nix = { workspace = true, features = ["signal"] }

gix = { version = "0.86", features = ["tree-editor", "revision"] }
gix-imara-diff = { version = "0.2", features = ["unified_diff"] }
hmac = "0.13"
image.workspace = true
rand.workspace = true
redb.workspace = true
tiktoken = "3.5"
ureq.workspace = true
url.workspace = true
resvg.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
thiserror.workspace = true
sha1 = "0.11"
sha2.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
zeroize.workspace = true
humfmt.workspace = true
choreo-keystore.workspace = true
choreo-mcp.workspace = true
choreo-proto.workspace = true
choreo-transport.workspace = true
choreo-ai-protocols.workspace = true
signal-hook.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
# Unicode general-category property (see `is_unsafe_unicode` in tools/mod.rs):
# generated from the Unicode data tables (v1.1.0 ships Unicode 16.0), so the
# sanitizer's Cf set stays complete across Unicode releases without a
# hand-maintained enumeration.
unicode-general-category = "1.1"
# OpenMetrics / Prometheus monitoring.
# The `process` feature exposes process-level metrics (RSS, CPU, FD count)
# alongside our application-level gauges, counters, and histograms.
prometheus = { version = "0.14", features = ["process"] }
tiny_http = "0.12"
ckb-vm = { version = "0.24.14", features = ["detect-asm"] }
tempfile.workspace = true
postcard.workspace = true
# Native PDF parsing (pdf_classify / pdf_to_markdown).
#
# Pinned to a SHA on a contributor fork because upstream (firecrawl/pdf-inspector)
# still ships lopdf ^0.41.0, which is vulnerable to RUSTSEC-2026-0187: a ~21 KB
# crafted PDF with ~10,000-deep nested objects aborts the process via stack
# overflow — a SIGABRT that `catch_unwind` CANNOT intercept. The fix is lopdf
# 0.42.0 (MAX_NESTING_DEPTH), and upstream PR firecrawl/pdf-inspector#198
# (omeileo, single commit f86decf) bumps it, verified source-compatible with
# 860 green tests and a clean error instead of SIGABRT on the PoC.
#
# Once upstream merges #198/#222 and publishes, switch back to:
#   pdf-inspector = "0.1"  # (or the fixed release)
# and drop this comment.
pdf-inspector = { git = "https://github.com/omeileo/pdf-inspector", rev = "f86decf82d72e4bc318aaf54c04f854763cbed1c" }

# Desktop notifications — DBus on Linux, macOS Notification Center on macOS.
# notify-rust auto-selects the macOS backend when target_os = "macos".
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18.0", default-features = false, features = ["d"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify-rust = { version = "4.18.0", default-features = false }

[features]
# Test-only: exposes the bounded-shutdown seam (`join_session_shutdown_with_grace_for_test`)
# used by tests/session_shutdown.rs.  Enabled for test builds via the self
# dev-dependency below, so it never leaks into the published public API.
test-utils = []

[dev-dependencies]
filetime = "0.2"
serial_test.workspace = true
# Enable the `test-utils` feature when building tests/examples/benchmarks for
# this package (a package may depend on itself in dev-dependencies).
choreo-daemon = { path = ".", features = ["test-utils"] }
