[package]
name = "choreo-daemon"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[lib]
name = "choreo_daemon"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
zlob = "1.6"
grep-regex = "0.1"
grep-searcher = "0.1"
hex.workspace = true
# Type-safe syscall bindings for the process-control path (kill/pgid/pidfd),
# the bounded pipe-drain poll loop, and the non-blocking fcntl on child pipes.
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }

# Local headless Chromium/Chrome control for the `retrieve_webpage` tool (CDP).
# Uses default features (no `fetch`): the tool requires a Chromium/Chrome
# binary already installed on the host — we never auto-download one.
headless_chrome = "1.0.22"

gix = { version = "0.86", features = ["tree-editor", "revision"] }
gix-imara-diff = { version = "0.2", features = ["unified_diff"] }
hmac = "0.13"
image.workspace = true
heif-oxide.workspace = true
rand.workspace = true
redb.workspace = true
tiktoken = "4"
ureq.workspace = true
url.workspace = true
resvg.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
thiserror.workspace = true
sha1 = "0.11"
sha2.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
zeroize.workspace = true
humfmt.workspace = true
choreo-keystore.workspace = true
# Choreographr Coordination Platform read/write operations (blockchain content
# registry + IPFS + indexer). Unconditional: the `coord` tool group is always
# enabled, so this is a plain (non-optional) workspace dependency.
choreo-coord.workspace = true
choreo-mcp.workspace = true
choreo-proto.workspace = true
choreo-sanitize.workspace = true
choreo-image.workspace = true
choreo-transport.workspace = true
choreo-ai-protocols.workspace = true
signal-hook.workspace = true
notify.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
# OpenMetrics / Prometheus monitoring.
# The `process` feature exposes process-level metrics (RSS, CPU, FD count)
# alongside our application-level gauges, counters, and histograms.
# Both are optional, pulled in by the `metrics` feature (off by default) so a
# plain build drops the whole prometheus/tiny_http tree.
prometheus = { version = "0.14", features = ["process"], optional = true }
tiny_http = { version = "0.12", optional = true }
# Blockchain tools (EVM via alloy, Substrate/Polkadot via subxt). The tool
# implementations — and the tokio sidecar runtime they need — live in the
# `choreo-blockchain` crate, so tokio/alloy/subxt are never direct deps here.
# This optional dep is enabled by the `blockchain` feature (off by default).
choreo-blockchain = { workspace = true, optional = true }
ckb-vm = { version = "0.24.14", features = ["detect-asm"] }
tempfile.workspace = true
postcard.workspace = true
rmp-serde.workspace = true
structured-zstd.workspace = true
# Native PDF parsing (pdf_classify / pdf_to_markdown) — a plain, unconditional
# registry dependency. No security pin or feature gate: the old pin/fork existed
# because upstream 0.1.x shipped lopdf ^0.41.0, vulnerable to RUSTSEC-2026-0187
# (a ~21 KB crafted PDF with ~10,000-deep nested objects aborts the process via
# stack overflow, a SIGABRT `catch_unwind` cannot intercept). 1.15.0 ships
# lopdf >= 0.42 (MAX_NESTING_DEPTH), so the documented revert path was applied:
# the `[patch.crates-io]` redirect and the `pdf` feature were removed.
pdf-inspector = "1"

[features]
# Prometheus/OpenMetrics instrumentation and the `/metrics` HTTP server
# (src/metrics.rs). Off by default: a plain build compiles it out entirely
# (no prometheus/tiny_http dependencies), and release binaries opt in via
# `scripts/release.sh --features metrics,blockchain`. The module's public API
# degrades to no-op stubs when disabled, so the daemon's instrumentation call
# sites compile unchanged in both configurations — and `--metrics-addr` then
# fails startup with a clear error instead of being silently ignored.
metrics = ["dep:prometheus", "dep:tiny_http"]
# EVM (alloy) and Substrate/Polkadot (subxt) blockchain tools. Off by default:
# enabling it pulls in the choreo-blockchain crate (tokio + alloy/subxt client
# stacks) that a plain build has no use for. Opt in with `--features blockchain`
# (or the root package's `blockchain` feature, which forwards here).
blockchain = ["dep:choreo-blockchain"]
# Opt-in AVIF decode via `image/avif-native` (dav1d, a C library). OFF by
# default so the default/release build stays C-free (see the release.sh
# static-musl rationale and the workspace `image` comment). A source build with
# `--features avif` needs a built `libdav1d` (system pkg-config or a compiled
# static lib) — see the dav1d crate's README for per-OS provisioning
# (Linux pkg-config, brew on macOS, vcpkg on Windows).
avif = ["image/avif-native"]
# Test-only: exposes the bounded-shutdown seam (`join_session_shutdown_with_grace_for_test`)
# used by tests/session_shutdown.rs.  Enabled for test builds via the self
# dev-dependency below, so it never leaks into the published public API.
test-utils = []

[dev-dependencies]
filetime = "0.2"
serial_test.workspace = true
# Enable the `test-utils` feature when building tests/examples/benchmarks for
# this package (a package may depend on itself in dev-dependencies).
choreo-daemon = { path = ".", features = ["test-utils"] }
# The shared scripted HTTP mock provider for the reasoning round-trip wire
# tests lives in choreo-ai-protocols behind its `test-utils` feature.
choreo-ai-protocols = { workspace = true, features = ["test-utils"] }
# The real client-side connection library used by the daemon<->client
# integration tests (tests/daemon_client_unix.rs, tests/daemon_client_noise.rs).
choreo-client-core.workspace = true

# Windows-only deps: process-tree isolation for shell tools (the Job Object
# FFI — the Windows analogue of Unix process-group killpg(2), used by
# `ChildJob`/`ProcessIsAlive` in src/tools/shell_util.rs) and the Unix-socket
# stand-in (named pipes) for the daemon's server layer. Target-specific —
# never built on Unix.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
uds_windows.workspace = true
