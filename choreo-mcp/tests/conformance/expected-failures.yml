# Expected-failures baseline for the official MCP client conformance suite
# (`@modelcontextprotocol/conformance`), consumed by `scripts/mcp-conformance.sh`
# (and the `mcp-conformance` CI job).
#
# The suite already understands a baseline: a scenario listed here that FAILS is
# accepted (exit 0), a scenario listed here that PASSES is a STALE entry and
# fails the run, and a scenario NOT listed here that FAILS is an unexpected
# regression. So this file records the client scenarios the pinned suite runs
# that choreo-mcp knowingly does not yet pass; removing an entry once the
# corresponding feature lands is what makes CI re-enforce it.
#
# The suite is pinned to a specific version by the runner; these names are the
# scenarios that version runs against our era, minus the ones we pass (the
# `initialize` and `tools_call` core scenarios).
client:
  # OAuth flows (out of scope until the post-ship auth work). choreo-mcp has no
  # OAuth provider today: remote servers use a static token in `headers`.
  - auth/metadata-default
  - auth/metadata-var1
  - auth/metadata-var2
  - auth/metadata-var3
  - auth/basic-cimd
  - auth/scope-from-www-authenticate
  - auth/scope-from-scopes-supported
  - auth/scope-omitted-when-undefined
  - auth/scope-step-up
  - auth/scope-retry-limit
  - auth/token-endpoint-auth-basic
  - auth/token-endpoint-auth-post
  - auth/token-endpoint-auth-none
  - auth/pre-registration
  # Elicitation. The client deliberately does NOT advertise the `elicitation`
  # capability (there is no prompt surface to honor it), and the spec forbids
  # advertising a capability that is not served, so a scenario that requires it
  # cannot pass. Un-baseline when a UI surface lands.
  - elicitation-sep1034-client-defaults
  # SSE-retry (SEP-1699): the legacy GET stream's `retry:`-field resumption.
  # The client's HTTP transport reconnects its SSE streams with a bounded
  # backoff (see `choreo-mcp`'s engine), but it does not consume the advisory
  # `retry:` field nor drive the GET-stream resumption this scenario measures.
  - sse-retry
