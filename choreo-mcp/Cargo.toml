[package]
name = "choreo-mcp"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
# The code-injection environment set shared with the daemon's shell tool: the
# stdio child strips `choreo_sanitize::child_env::INJECTION_ENV_VARS`, the same
# canonical list, so the two spawn paths cannot drift. `choreo-sanitize` is a
# deliberately tiny leaf crate (only `unicode-general-category`), so this adds
# no meaningful weight to this otherwise-light client crate.
choreo-sanitize.workspace = true
# The one hardened log-file open (O_NOFOLLOW + euid/regular-file check + 0600)
# shared with the suite's own logs, so a stdio server's captured stderr is
# opened exactly like every other Choreographr log rather than re-deriving the
# hardening here.
choreo-shared.workspace = true
# Cross-thread control-plane channels: the per-server dispatcher's command and
# reply channels, and the call-completion notifications it drains between
# commands. Workspace policy: crossbeam, never std mpsc.
crossbeam-channel.workspace = true
# The official MCP Rust SDK, used only inside this crate. Default features are
# off; we enable the client role, the stdio child-process transport, and the
# Streamable HTTP client transport (whose TLS rides the `reqwest` dependency
# below). The daemon never sees an rmcp type (the blocking facade is fully typed
# on our own `McpServer`/`McpServerHandle`/`McpTool`/`CallToolResult`).
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# Place the server child in its own process group on Unix so a launcher's
# grandchild dies with it (the rmcp transport uses these wrappers' kill).
process-wrap.workspace = true
# HTTP client for the Streamable HTTP transport: choreo-mcp builds the client to
# set the connect timeout and to run the deprecated HTTP+SSE pre-flight probe,
# then hands it to rmcp's transport. Feature-unified with rmcp's own reqwest, so
# enabling it adds no second copy to the build.
reqwest.workspace = true
# Sidecar async runtime. rmcp is async and the daemon is thread-only: this crate
# owns one process-wide multi-thread runtime that drives the client futures, and
# the daemon calls this crate's blocking `McpServer::*` methods. `sync` provides
# the per-call cancellation primitive; `macros` the `select!` in the call task.
tokio = { workspace = true, features = ["sync", "macros", "io-util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The per-server stderr log's hardened open (O_NOFOLLOW + euid check) and the
# unix fcntl that returns the child's non-blocking stderr pipe to blocking mode
# for the drain thread. Unix-only; Windows inherits the parent dir's ACLs.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Test fixture: a scripted MCP stdio server that the integration suite spawns as
# a subprocess (via `env!("CARGO_BIN_EXE_mcp-fixture-server")`), removing the
# suite's dependency on Node/npx and the network. It speaks both the legacy
# `initialize` era and the stateless `server/discover` era per scenario.
[[bin]]
name = "mcp-fixture-server"
path = "tests/fixtures/fixture_server.rs"

# Conformance harness: the client process the official
# `@modelcontextprotocol/conformance` suite runs against each scenario server
# (see `scripts/mcp-conformance.sh`). A test fixture like the one above — never
# shipped, and not built by release packaging (which selects only the root and
# `choreo-tui` packages).
[[bin]]
name = "mcp-conformance-client"
path = "tests/fixtures/conformance_client.rs"

[dev-dependencies]
# Temporary directories for the cancellation test's in-flight marker file.
tempfile.workspace = true
# The integration tests build a streaming chunk channel to exercise the
# progress-to-chunk path (the same channel type the daemon passes in).
crossbeam-channel.workspace = true

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
