[package]
name = "choreo-mcp"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
# Cross-thread control-plane channels (the stdio transport's response /
# notification / waiter channels). Workspace policy: crossbeam, never std mpsc.
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Used only for killpg-style process-group cleanup of MCP server subprocesses.
libc = "0.2"

# Test fixture: a scripted legacy MCP stdio server that the integration suite
# spawns as a subprocess (via `env!("CARGO_BIN_EXE_mcp-fixture-server")`),
# removing the suite's dependency on Node/npx and the network.
[[bin]]
name = "mcp-fixture-server"
path = "tests/fixtures/fixture_server.rs"

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
