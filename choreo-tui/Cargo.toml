[package]
name = "choreo-tui"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
ansi-to-tui = "8.0.1"
anstyle-progress = "0.1"
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm = "0.29"
dirs.workspace = true
image.workspace = true
serde.workspace = true
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
signal-hook.workspace = true
resvg.workspace = true
syntect = "5.3"
choreo-client-core.workspace = true
choreo-keystore.workspace = true
choreo-markdown.workspace = true
choreo-sanitize.workspace = true
unicode-segmentation.workspace = true
unicode-width = "0.2"
choreo-proto.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
lru.workspace = true
chrono.workspace = true
crossbeam = "0.8"
mio = { version = "1.2", features = ["os-ext"] }
tui-prompts = "0.6"
humfmt.workspace = true

# `nix` is a Unix-only crate: it does not compile on Windows at all (no
# POSIX signals/fds there), so it is gated behind cfg(unix) rather than being
# a universal dependency. `mio` stays universal — it is cross-platform and
# its `mio::unix` module is cfg-gated internally.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "fs"] }

[dev-dependencies]
tempfile.workspace = true
