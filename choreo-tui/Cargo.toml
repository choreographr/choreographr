[package]
name = "choreo-tui"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# The crate has one library and one binary, so `cargo run -p choreo-tui`
# is unambiguous without `default-run`; the explicit `[[bin]]` just pins the
# path to the thin wrapper that calls [`choreo_tui::main`].
[[bin]]
name = "choreo-tui"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm = "0.29"
image.workspace = true
serde.workspace = true
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, the only exact
# way to measure a wrapped paragraph's rendered row count. The reference popups
# (Terminal page, Help modal) size themselves to their content, and measuring
# with anything other than ratatui's own wrapper would risk a one-row clip.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
syntect = "5.3"
# Small-vector storage for the renderer's per-line copy-chrome metadata
# (`LineChrome`): the overwhelmingly common case is empty, and a `SmallVec`
# keeps that allocation-free while still allowing multiple intervals on the
# rare nested-chrome row.  Only choreo-tui uses it, so it stays crate-local.
smallvec = "1.16.5"
choreo-client-core.workspace = true
choreo-keystore.workspace = true
choreo-markdown.workspace = true
choreo-sanitize.workspace = true
choreo-image.workspace = true
unicode-segmentation.workspace = true
unicode-width = "0.2"
zeroize.workspace = true
choreo-proto.workspace = true
choreo-shared.workspace = true
tracing.workspace = true
lru.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
tui-prompts = "0.6"
humfmt.workspace = true
# Process-wide allocator for the binary only — enabled by the `mimalloc`
# feature (see [features] below); library consumers never see it.
mimalloc = { version = "0.1", optional = true }

# Every use of `nix`, `mio` and `signal-hook` in this crate is behind
# `#[cfg(unix)]`: `nix` does not compile on Windows at all, `mio` is reached only
# through `mio::unix` (`SourceFd`, the self-pipe, the `Poll` over them), and
# `signal_hook`'s low-level pipe handler is Unix-only. Declaring them here rather
# than as universal dependencies keeps the Windows build honest: on a non-unix
# target the crate names none of them, and Cargo's `[lints.cargo]`
# `unused_dependencies` deny (see the root manifest) fails the build for a
# dependency that is resolved but never used.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
nix = { workspace = true, features = ["signal", "fs"] }
mio = { version = "1.2", features = ["os-ext"] }

[features]
# mimalloc — process-wide allocator for the `choreo-tui` BINARY, enabled ONLY
# by the static musl tarball build in the release pipeline (musl's default
# malloc is weaker; mimalloc's per-thread heaps replace it). Off by default so
# crates.io / `cargo install` builds stay on the system allocator and need no
# C compiler.
mimalloc = ["dep:mimalloc"]
# Opt-in AVIF decode via `image/avif-native` (dav1d, a C library). Off by
# default so the default/release build stays C-free (see the release.sh
# static-musl rationale and the workspace `image` comment). Forwarded from the
# root `avif` feature so `--features avif` turns it on for the client display
# decode path too (image_worker.rs must be able to decode AVIF it receives).
avif = ["image/avif-native"]

# cargo-binstall metadata — IDENTICAL to the root package's block. The
# release tarball is ONE archive containing both shipped binaries named after
# the choreographr version; binstall installs only the binaries the package
# declares, so `cargo binstall choreo-tui` resolves the same asset URL and
# extracts just `choreo-tui`. The `{ version }` template renders THIS crate's
# version — workspace versions are inherited (`version.workspace = true`), so
# it always matches the release version. See ARCHITECTURE.md's binstall note.
[package.metadata.binstall]
pkg-url = "https://github.com/choreographr/choreographr/releases/download/v{ version }/choreographr-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Same glibc mapping as the root package: glibc hosts get no native Linux
# asset, so binstall is pointed at the static musl tarball — both x86_64 and
# arm64 host targets.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/choreographr/choreographr/releases/download/v{ version }/choreographr-{ version }-x86_64-unknown-linux-musl{ archive-suffix }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/choreographr/choreographr/releases/download/v{ version }/choreographr-{ version }-aarch64-unknown-linux-musl{ archive-suffix }"

[dev-dependencies]
tempfile.workspace = true
# Unit tests construct `PreflightError::Rejected(TransportError)` to pin the
# preflight failure message's wording without a network.
choreo-transport.workspace = true
# Pulls in the shared test-only config-root fixture from choreo-client-core.
choreo-client-core = { workspace = true, features = ["test-support"] }

# Workspace-wide lints (see [workspace.lints.clippy] in the root Cargo.toml).
[lints]
workspace = true
