[package]
name = "choreo-tui"
version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
edition = "2024"
rust-version.workspace = true
# The crate has one library and one binary, so `cargo run -p choreo-tui`
# is unambiguous without `default-run`; the explicit `[[bin]]` just pins the
# path to the thin wrapper that calls [`choreo_tui::main`].
[[bin]]
name = "choreo-tui"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
anstyle-progress = "0.1"
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm = "0.29"
dirs.workspace = true
image.workspace = true
heif-oxide.workspace = true
serde.workspace = true
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
signal-hook.workspace = true
resvg.workspace = true
syntect = "5.3"
choreo-client-core.workspace = true
choreo-keystore.workspace = true
postcard.workspace = true
choreo-markdown.workspace = true
choreo-sanitize.workspace = true
choreo-image.workspace = true
unicode-segmentation.workspace = true
unicode-width = "0.2"
zeroize.workspace = true
choreo-proto.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
lru.workspace = true
chrono.workspace = true
crossbeam = "0.8"
mio = { version = "1.2", features = ["os-ext"] }
tui-prompts = "0.6"
humfmt.workspace = true
# Process-wide allocator for the binary only — enabled by the `mimalloc`
# feature (see [features] below); library consumers never see it.
mimalloc = { version = "0.1", optional = true }

# `nix` is a Unix-only crate: it does not compile on Windows at all (no
# POSIX signals/fds there), so it is gated behind cfg(unix) rather than being
# a universal dependency. `mio` stays universal — it is cross-platform and
# its `mio::unix` module is cfg-gated internally.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "fs"] }

[features]
# mimalloc — process-wide allocator for the `choreo-tui` BINARY, enabled ONLY
# by the static musl tarball build in the release pipeline (musl's default
# malloc is weaker; mimalloc's per-thread heaps replace it). Off by default so
# crates.io / `cargo install` builds stay on the system allocator and need no
# C compiler.
mimalloc = ["dep:mimalloc"]
# Opt-in AVIF decode via `image/avif-native` (dav1d, a C library). Off by
# default so the default/release build stays C-free (see the release.sh
# static-musl rationale and the workspace `image` comment). Forwarded from the
# root `avif` feature so `--features avif` turns it on for the client display
# decode path too (image_worker.rs must be able to decode AVIF it receives).
avif = ["image/avif-native"]

[dev-dependencies]
tempfile.workspace = true
# Unit tests construct `PreflightError::Rejected(TransportError)` to pin the
# preflight failure message's wording without a network.
choreo-transport.workspace = true
# Pulls in the shared test-only config-root fixture from choreo-client-core.
choreo-client-core = { workspace = true, features = ["test-support"] }
