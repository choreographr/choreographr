name: homebrew-verify

# Verifies the Homebrew channel end-to-end — the SOP's manual
# "on a Mac: `brew install … && choreographr --version`" final step
# (RELEASE.md Phase 4) — on a GitHub-hosted macOS arm64 runner, so closing
# this channel no longer needs a physical Mac.
#
# Triggered by the conductor with `workflow_dispatch` AFTER the tap has been
# bumped (Phase 4). It is deliberately NOT `on: release`: the GitHub release
# is created by release.yml with the default GITHUB_TOKEN, and events raised by
# GITHUB_TOKEN do not start further workflow runs (GitHub's anti-recursion
# rule). It is also the wrong moment — the tap is updated in a later, manual
# Phase-4 step, and this workflow asserts the tap already points here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version to verify (e.g. 0.2.0). Defaults to the workspace
          version in Cargo.toml at the checked-out ref.
        required: false
        type: string
      ref:
        description: "Git ref to check out (default: the ref this was dispatched on)"
        required: false
        type: string

permissions:
  contents: read

env:
  # Deterministic, quiet brew on the runner.
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  verify:
    # The shipped macOS artifacts are aarch64-apple-darwin AND
    # x86_64-apple-darwin (both produced by one release.sh pass on the arm64
    # release job). This job runs on `macos-latest` (arm64) because it is the
    # only free macOS runner: brew evaluates `Hardware::CPU.arm?` and installs
    # the arm64 branch E2E (download, checksum, binaries, service). The
    # x86_64 branch CANNOT be exercised here — an Intel brew under /usr/local
    # needs either a paid x64 runner or a fragile Rosetta-brew bootstrap, and
    # the install itself would run translated. The Intel channel is instead
    # verified by construction: update-homebrew-tap.sh ABORTS unless both
    # tarballs exist in dist/ and rewrites BOTH digests from the exact release
    # artifacts, so a wrong/placeholder Intel digest cannot reach the tap.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Require an arm64 runner
        run: |
          arch="$(uname -m)"
          [ "$arch" = "arm64" ] || {
            echo "::error::expected arm64 (this job verifies the formula's arm64 branch E2E; the x86_64 branch is verified by construction — see the comment on the verify job), got $arch"
            exit 1
          }

      - name: Resolve the version
        id: v
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          v="${v#v}"   # tolerate a leading "v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "==> verifying choreographr ${v}"

      - name: Tap formula must already be at this version
        # Fail with a clear message if the tap has not been bumped yet (the
        # usual cause of a red run) rather than deep inside brew.
        run: |
          want="${{ steps.v.outputs.version }}"
          raw="https://raw.githubusercontent.com/choreographr/homebrew-choreographr/master/Formula/choreographr.rb"
          have="$(curl -fsSL "$raw" | sed -n 's/^  version "\([^"]*\)"/\1/p' | head -n1)"
          echo "tap formula version: '${have:-<none>}'   wanted: '${want}'"
          [ "$have" = "$want" ] || {
            echo "::error::tap is at '${have:-none}', not '$want' — run RELEASE.md Phase 4 (update-homebrew-tap.sh --push) first"
            exit 1
          }

      - name: Install from the tap and assert --version
        run: |
          want="${{ steps.v.outputs.version }}"
          brew update
          brew install choreographr/choreographr/choreographr
          got="$(choreographr --version)"
          echo "choreographr --version => $got"
          case "$got" in
            *"${want}"*) echo "OK: --version reports ${want}" ;;
            *) echo "::error::--version '$got' does not report '$want'"; exit 1 ;;
          esac

      - name: Formula test
        run: brew test choreographr/choreographr/choreographr

      - name: Verify BOTH branches' digests against the release assets
        # The install above exercises only the arm64 branch on this arm64
        # runner. This step closes the Intel branch's remaining failure mode
        # (metadata-level: wrong digest or 404): download BOTH tarballs from the
        # LIVE tap formula's URLs and assert each matches the sha256 string
        # parsed from the same formula. Digest-level only — nothing is
        # executed — but it is arch-agnostic, so the x86_64 branch gets exactly
        # the same check brew itself would perform on an Intel Mac.
        run: |
          raw="https://raw.githubusercontent.com/choreographr/homebrew-choreographr/master/Formula/choreographr.rb"
          curl -fsSL "$raw" -o /tmp/formula.rb
          ver="$(sed -n 's/^  version "\([^"]*\)"/\1/p' /tmp/formula.rb | head -n1)"
          base="https://github.com/choreographr/choreographr/releases/download/v${ver}"
          check() { # <arch> <branch-sha>
            local arch="$1" want="$2"
            curl -fsSL "$base/choreographr-${ver}-${arch}.tar.gz" -o "/tmp/${arch}.tar.gz"
            got="$(shasum -a 256 "/tmp/${arch}.tar.gz" | awk '{print $1}')"
            [ "$got" = "$want" ] || {
              echo "::error::${arch} tarball digest mismatch: formula says ${want}, downloaded asset hashes to ${got}"
              exit 1
            }
            echo "OK: ${arch} digest matches (${got:0:12}…)"
          }
          arm_sha="$(sed -n '/if Hardware::CPU.arm?/,/^  else/ s/^    sha256 "\([^"]*\)"/\1/p' /tmp/formula.rb | head -n1)"
          x86_sha="$(sed -n '/^  else/,/^  end/ s/^    sha256 "\([^"]*\)"/\1/p' /tmp/formula.rb | head -n1)"
          check aarch64-apple-darwin "$arm_sha"
          check x86_64-apple-darwin "$x86_sha"

      - name: Service must be installed but NOT started
        # SOP invariant: the launchd agent is installed, never auto-enabled.
        run: |
          brew services list | sed 's/^/  /'
          if brew services list | grep -Eq '^choreographr[[:space:]]+started'; then
            echo "::error::the choreographr service was auto-started — it must stay disabled"
            exit 1
          fi
          echo "OK: service installed but not started"
