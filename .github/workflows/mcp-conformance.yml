name: MCP conformance

# Runs the official Model Context Protocol client conformance suite
# (`@modelcontextprotocol/conformance`) against the `choreo-mcp` harness
# (`mcp-conformance-client`), diffed against the committed expected-failures
# baseline. See scripts/mcp-conformance.sh (the single home of the pinned suite
# version, the spec version, and the baseline path).
#
# Both supported protocol eras run as a matrix: the stateful 2025-11-25 wire and
# the stateless 2026-07-28 wire. A scenario that applies to both is measured once
# per era, so a pass on one says nothing about the other.
#
# The suite is an npm package (`npx`) and starts local HTTP scenario servers,
# so the job needs Node.js and network access. It is scoped to the MCP crate and
# the runner/baseline so unrelated changes do not pay for it.

on:
  push:
    branches: [master]
    paths:
      - 'choreo-mcp/**'
      - 'scripts/mcp-conformance.sh'
      - '.github/workflows/mcp-conformance.yml'
  pull_request:
    paths:
      - 'choreo-mcp/**'
      - 'scripts/mcp-conformance.sh'
      - '.github/workflows/mcp-conformance.yml'
  workflow_dispatch:

jobs:
  client:
    name: MCP client conformance (${{ matrix.spec }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run every era even if one fails, so a single job shows the full matrix.
      fail-fast: false
      matrix:
        spec: ['2025-11-25', '2026-07-28']
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          # The workspace pins nightly (rust-toolchain.toml); install it so the
          # runner's `cargo build` uses the fast dev profile without a download
          # at invocation time.
          rustup toolchain install nightly --profile minimal --no-self-update

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the client conformance suite
        env:
          MCP_CONFORMANCE_SPEC_VERSION: ${{ matrix.spec }}
        run: ./scripts/mcp-conformance.sh
